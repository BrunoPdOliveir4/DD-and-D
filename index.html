<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DD&D — Dynamic Dungeons & Dragons</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #07070c; overflow: hidden; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    
    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; z-index: 1000;
      background: radial-gradient(ellipse at 50% 40%, #12122a 0%, #07070c 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; transition: opacity 0.6s ease-out;
    }
    #loading-screen h1 {
      font-size: 56px; letter-spacing: 8px; font-weight: 700;
      background: linear-gradient(135deg, #b8923e 0%, #f5e6a3 35%, #c9a44e 50%, #8b6914 80%, #c9a44e 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: title-shimmer 3s ease-in-out infinite;
      margin-bottom: 6px; filter: drop-shadow(0 2px 8px rgba(201,164,78,0.25));
    }
    @keyframes title-shimmer {
      0%,100% { background-position: 0% center; }
      50% { background-position: 200% center; }
    }
    #loading-screen .subtitle {
      font-size: 12px; color: #555; letter-spacing: 5px; margin-bottom: 40px;
      text-transform: uppercase;
    }
    .loading-bar-container {
      width: 240px; height: 3px; background: rgba(255,255,255,0.05);
      border-radius: 2px; overflow: hidden; position: relative;
    }
    .loading-bar-fill {
      height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent 0%, #c9a44e 50%, transparent 100%);
      animation: loading-slide 1.8s ease-in-out infinite;
      border-radius: 2px;
    }
    @keyframes loading-slide { 0% { transform: translateX(-200%); } 100% { transform: translateX(350%); } }
    
    /* Decorative rune circles */
    .loading-rune {
      position: absolute; border: 1px solid rgba(201,164,78,0.06); border-radius: 50%;
      animation: rune-pulse 4s ease-in-out infinite;
    }
    .loading-rune:nth-child(2) { width: 300px; height: 300px; animation-delay: 0s; }
    .loading-rune:nth-child(3) { width: 400px; height: 400px; animation-delay: 1s; }
    .loading-rune:nth-child(4) { width: 500px; height: 500px; animation-delay: 2s; }
    @keyframes rune-pulse {
      0%,100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.6; transform: scale(1.02) rotate(3deg); }
    }
    
    /* Focus styles for inputs */
    input:focus { border-color: #c9a44e !important; box-shadow: 0 0 0 2px rgba(201,164,78,0.15) !important; }
    button:hover { filter: brightness(1.15); }
    button:active { transform: scale(0.97); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-rune"></div>
    <div class="loading-rune"></div>
    <div class="loading-rune"></div>
    <h1>DD&D</h1>
    <div class="subtitle">Dynamic Dungeons & Dragons</div>
    <div class="loading-bar-container">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/client/main.ts"></script>
</body>
</html>
